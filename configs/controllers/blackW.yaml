# 文件：blackW.yaml
# 作用：定义 blackW 基础动作的周期、统一关节顺序、姿态和固定增益。
name: blackW
control_period_ms: 5
command_validity_ms: 10

# blackW 参考实现只有 200 周期单段起立。当前公共控制器仍是两段接口，因此第一段执行
# 完整插值，第二段只用 1 周期确认同一目标；阶段 10 不得把它解释成第二个姿态动作。
getup_pre_cycles: 200
getup_cycles: 1
getdown_cycles: 500

joint_names:
  [FL_hip_joint, FL_thigh_joint, FL_calf_joint, FL_wheel_joint,
   FR_hip_joint, FR_thigh_joint, FR_calf_joint, FR_wheel_joint,
   RL_hip_joint, RL_thigh_joint, RL_calf_joint, RL_wheel_joint,
   RR_hip_joint, RR_thigh_joint, RR_calf_joint, RR_wheel_joint]

pre_getup_position:
  [0.0, 0.8014, -1.527, 0.0,
   -0.0, -0.8014, 1.527, 0.0,
   -0.0, 0.8014, -1.527, 0.0,
   0.0, -0.8014, 1.527, 0.0]
stand_position:
  [0.0, 0.8014, -1.527, 0.0,
   -0.0, -0.8014, 1.527, 0.0,
   -0.0, 0.8014, -1.527, 0.0,
   0.0, -0.8014, 1.527, 0.0]
fixed_kp:
  [80.0, 80.0, 80.0, 0.0,
   80.0, 80.0, 80.0, 0.0,
   80.0, 80.0, 80.0, 0.0,
   80.0, 80.0, 80.0, 0.0]
fixed_kd:
  [3.0, 3.0, 3.0, 0.5,
   3.0, 3.0, 3.0, 0.5,
   3.0, 3.0, 3.0, 0.5,
   3.0, 3.0, 3.0, 0.5]
