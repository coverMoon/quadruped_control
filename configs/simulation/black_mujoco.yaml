# 文件：black_mujoco.yaml
# 作用：配置 black 交互式 MuJoCo 仿真的实时调度和画面同步参数。

# 仿真时间相对墙钟时间的倍率，有效范围 [0.01, 100]。
# 1.0 为实时，2.0 为两倍速，0.5 为半速。
# 该参数只改变物理循环的墙钟节奏，不改变 MJCF 中的物理步长。
real_time_factor: 1.0

# 物理线程向官方 Simulate 界面提交最新状态的频率，单位为 Hz，有效范围 [1, 1000]。
# 这决定画面状态更新频率，不等同于 GPU 换帧率；换帧率还受 VSync 和显示器影响。
visual_sync_hz: 60.0

# true：按显示器刷新率垂直同步；false：官方界面尽可能快地换帧。
vsync: true
