  - {name: RL_hip_joint,   role: leg, position_limited: true, min_position: -10.0, max_position: 10.0, max_velocity: 20.0, max_effort: 40.0, max_kp: 100.0, max_kd: 10.0}
  - {name: RL_thigh_joint, role: leg, position_limited: true, min_position: -10.0, max_position: 10.0, max_velocity: 20.0, max_effort: 40.0, max_kp: 100.0, max_kd: 10.0}
